<div class="dialog-header">
  <div class="header-title">Add Event</div>
  <button mat-icon-button mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="dialog-body">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Title</mat-label>
    <input matInput [(ngModel)]="form.title" placeholder="Event title" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Type</mat-label>
    <mat-select [(ngModel)]="form.type">
      <mat-option value="match">Match</mat-option>
      <mat-option value="training">Training</mat-option>
      <mat-option value="meeting">Meeting</mat-option>
      <mat-option value="assessment">Physical Assessment</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Date</mat-label>
    <input matInput type="date" [(ngModel)]="form.date" />
  </mat-form-field>

  <div class="time-row">
    <mat-form-field appearance="outline" class="half-width">
      <mat-label>Start Time</mat-label>
      <input matInput type="time" [(ngModel)]="form.timeStart" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="half-width">
      <mat-label>End Time</mat-label>
      <input matInput type="time" [(ngModel)]="form.timeEnd" />
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Location</mat-label>
    <input matInput [(ngModel)]="form.location" placeholder="e.g. Training Ground" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Squad</mat-label>
    <input matInput [(ngModel)]="form.squad" placeholder="e.g. First Team" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Staff</mat-label>
    <input matInput [(ngModel)]="form.staff" placeholder="e.g. Michael Anderson" />
  </mat-form-field>
</div>

<div class="dialog-actions">
  <button class="cancel-btn" mat-dialog-close>Cancel</button>
  <button class="save-btn" (click)="save()" [disabled]="!form.title || !form.date">
    <mat-icon>add</mat-icon> Add Event
  </button>
</div>
